body{margin:0}
button:focus-visible,a:focus-visible{outline:2px solid #78006E;outline-offset:2px}

<div dir="{{ dir }}" style="{{ rootStyle }}">

<sc-if value="{{ expanded }}" hint-placeholder-val="{{ true }}">

<div style="display: flex; flex-direction: column; gap: 4px">
<button onClick="{{ toggle }}" style="align-self: flex-end; border: 0; background: none; color: #6B6B6B; font-size: 11px; font-family: inherit; display: flex; align-items: center; gap: 6px; cursor: pointer; padding: 6px 4px; margin-bottom: 14px">{{ L.hide }} <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#6B6B6B" stroke-width="2" stroke-linecap="round" style="{{ flip }}"><path d="M15 6l-6 6 6 6"></path></svg></button>

<a href="{{ dash.href }}" style="{{ dash.style }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="{{ icons.grid }}"></path></svg><span style="flex-grow: 1">{{ dash.label }}</span><sc-if value="{{ hasBadge }}" hint-placeholder-val="{{ true }}"><span style="min-width: 20px; height: 20px; border-radius: 10px; background: #FF4664; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{ badge }}</span></sc-if></a>

<sc-for list="{{ groups }}" as="g" hint-placeholder-count="6">

<sc-if value="{{ g.open }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 2px; padding: 2px 0 8px">

</sc-if>
</sc-for>
</div>
</sc-if>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 4px">
<div style="border-top: 1px solid #EBEBEB; padding-top: 12px; display: flex; flex-direction: column; gap: 4px">

<span style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 18px; background: #78006E; color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{ initials }}</span>

</sc-if>

</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px; border-top: 1px solid #EBEBEB; padding-top: 12px; width: 44px">
<sc-for list="{{ bottom }}" as="m" hint-placeholder-count="2">

</sc-for>
</div>
</nav>
</sc-if>

</div>
