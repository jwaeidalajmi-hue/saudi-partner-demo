<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Work with us</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Saudi Sans";src:url(assets/9d5b063e22fb4c1fdf4e126126e305fc.ttf) format("truetype");font-weight:400 700}
@font-face{font-family:"Saudi Serif";src:url(assets/036b8acfe104a78d15187d034057eea5.ttf) format("truetype");font-weight:400 700}
body{margin:0;background:#FFFFFF}
a{color:#78006E;text-decoration:none}a:hover{color:#5A0052}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 1440px; height: 1900px; display: flex; flex-direction: column; background: #FFFFFF; font-family: 'Saudi Sans', system-ui, sans-serif; color: #1A1A1A; overflow: hidden">
<div style="position: relative; z-index: 10; flex-shrink: 0"><dc-import name="PublicHeader" hint-size="1440px,104px"></dc-import></div>

<section style="background: #78006E; color: #FFFFFF; padding: 80px 72px 96px; display: flex; flex-direction: column; gap: 22px">
<span style="font-size: 14px; font-weight: 700; letter-spacing: 1px; color: #F0D6EC">WORK WITH US</span>
<h1 style="margin: 0; font-family: 'Saudi Serif', Georgia, serif; font-size: 68px; font-weight: 700; line-height: 1.08; max-width: 820px">Take Saudi tourism to more markets.</h1>
<div style="display: flex; gap: 14px; margin-top: 8px">
<a href="Register.dc.html" style="height: 54px; padding: 0 30px; border-radius: 27px; background: #FFFFFF; color: #78006E; font-size: 16px; font-weight: 700; display: flex; align-items: center">Become a partner →</a>
<a href="ForSuppliers.dc.html" style="height: 54px; padding: 0 28px; border-radius: 27px; border: 1px solid rgba(255,255,255,0.7); color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center">Explore supplier tools</a>
</div>
</section>

<section style="padding: 88px 72px; display: flex; flex-direction: column; gap: 28px">
<h2 style="margin: 0; font-family: 'Saudi Serif', Georgia, serif; font-size: 44px; font-weight: 700">Choose where you want to grow</h2>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px">
<sc-for list="{{ regions }}" as="r" hint-placeholder-count="4">
<button onClick="{{ r.pick }}" aria-pressed="{{ r.on }}" style="{{ r.style }}">
<span style="{{ r.iconStyle }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.5 2.5 3.5 5.5 3.5 9s-1 6.5-3.5 9c-2.5-2.5-3.5-5.5-3.5-9s1-6.5 3.5-9z"></path></svg></span>
<span style="font-size: 20px; font-weight: 700">{{ r.title }}</span>
<span style="font-size: 14px; line-height: 1.6; color: #4B4B4B; flex-grow: 1">{{ r.desc }}</span>
<span style="font-size: 14px; font-weight: 700; color: #78006E">Explore market →</span>
</button>
</sc-for>
</div>
<div style="background: #F7F1F6; border-radius: 18px; padding: 28px 32px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 13px; font-weight: 700; letter-spacing: 0.8px; color: #78006E">{{ sel.title }}</span>
<span style="font-size: 17px; line-height: 1.6">{{ sel.desc }}</span>
<span style="font-size: 14px; color: #4B4B4B">Market detail content: [SOURCE MARKET DATA, PRIORITY CHANNELS, UPCOMING STA CAMPAIGNS]</span>
</div>
</section>

<section style="margin: 0 72px 96px; background: #78006E; border-radius: 24px; padding: 56px; display: flex; align-items: center; justify-content: space-between; color: #FFFFFF">
<h2 style="margin: 0; font-family: 'Saudi Serif', Georgia, serif; font-size: 40px; font-weight: 700">Ready to work with Saudi Partner?</h2>
<a href="Register.dc.html" style="height: 54px; padding: 0 30px; border-radius: 27px; background: #FFFFFF; color: #78006E; font-size: 16px; font-weight: 700; display: flex; align-items: center">Get started →</a>
</section>

<div style="margin-top: auto"><dc-import name="PublicFooter" hint-size="1440px,440px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sel: 0 }; }
  renderVals() {
    var self = this;
    var R = [
      ['Middle East & Africa', 'Build connections across nearby source markets and fast-growing destinations.'],
      ['Asia Pacific', 'Reach travel partners and buyers across the Asia Pacific region.'],
      ['Americas', 'Connect your Saudi tourism offer with partners across North, Central, and South America.'],
      ['Europe', 'Work with European distributors, travel businesses, and destination partners.']
    ];
    var regions = R.map(function (r, i) {
      var on = self.state.sel === i;
      return { title: r[0], desc: r[1], on: on, pick: function () { self.setState({ sel: i }); },
        style: 'text-align: start; cursor: pointer; border-radius: 18px; padding: 28px; display: flex; flex-direction: column; gap: 12px; min-height: 280px; color: #1A1A1A; ' + (on ? 'border: 2px solid #78006E; background: #FFFFFF' : 'border: 1px solid #EBEBEB; background: #FFFFFF'),
        iconStyle: 'width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; ' + (on ? 'background: #78006E; color: #FFFFFF' : 'background: #F7EBF5; color: #78006E') };
    });
    var s = R[this.state.sel];
    return { regions: regions, sel: { title: s[0].toUpperCase(), desc: s[1] } };
  }
}
</script>
</body>
</html>
